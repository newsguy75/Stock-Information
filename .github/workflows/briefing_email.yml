name: portfolio-briefing-email

# 이메일 전용. GitHub Pages 미사용 → 비공개 레포에서 동작.
# Pages/도메인/승인 문제 전부 없음.

on:
  schedule:
    # 베트남(ICT) 05/07/09/11/13/15/17/19시 = UTC 22/00/02/04/06/08/10/12시
    - cron: "0 0,2,4,6,8,10,12,22 * * *"
  workflow_dispatch:

concurrency:
  group: briefing-email
  cancel-in-progress: false

jobs:
  email-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore holdings from secret
        env:
          HOLDINGS_JSON: ${{ secrets.HOLDINGS_JSON }}
        run: |
          if [ -n "$HOLDINGS_JSON" ]; then
            printf '%s' "$HOLDINGS_JSON" > holdings.json
            echo "holdings.json restored from secret"
          elif [ -f holdings.json ]; then
            echo "using repo holdings.json"
          else
            echo "::error::HOLDINGS_JSON secret 도 holdings.json 도 없음"; exit 1
          fi

      - name: Run briefing (Kakao + Email)
        env:
          KAKAO_REST_KEY:      ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_ACCESS_TOKEN:  ${{ secrets.KAKAO_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          HOLDINGS_PATH:       holdings.json
          EMAIL_FROM:          ${{ secrets.EMAIL_FROM }}
          EMAIL_APP_PW:        ${{ secrets.EMAIL_APP_PW }}
          EMAIL_TO:            ${{ secrets.EMAIL_TO }}
        run: python portfolio_briefing.py --force
