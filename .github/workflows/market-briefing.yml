name: market-briefing
on:
  schedule:
    # 30분 간격 실행 (평일). 장 시간대에도 매매동향/거래대금이 갱신되도록.
    - cron: "*/30 * * * 1-5"
  workflow_dispatch:      # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: market-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run market briefing
        env:
          KAKAO_REST_KEY:      ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_ACCESS_TOKEN:  ${{ secrets.KAKAO_ACCESS_TOKEN }}
        run: python market_briefing.py

      - name: Commit market briefing
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          if git diff --cached --quiet; then
            echo "변경사항 없음 — skip"
            exit 0
          fi
          git commit -m "chore: 시장 브리핑 $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            if git push; then
              echo "✓ push 성공 (시도 $i)"
              exit 0
            fi
            echo "push 실패, rebase 후 재시도 ($i/3)"
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          exit 1
