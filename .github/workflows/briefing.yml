name: portfolio-briefing

on:
  schedule:
    # 30분 간격, 월~금만 실행 (UTC 기준 요일 1-5).
    # 한국 장시간(KST 09:00~15:30 = UTC 00:00~06:30)은 UTC 월~금에 포함되므로 손실 없음.
    # 공휴일은 스크립트 내부 is_kr_trading_day() 가 추가로 skip.
    - cron: "*/30 * * * 1-5"
  workflow_dispatch:

concurrency:
  group: briefing
  cancel-in-progress: false

permissions:
  contents: write          # data/ 폴더 커밋을 위해 필요

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Korean font (matplotlib 한글 라벨용)
        continue-on-error: true
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq fonts-nanum || true
          fc-cache -f || true
          rm -rf ~/.cache/matplotlib || true
          echo "설치된 한글 폰트:"
          fc-list :lang=ko family 2>/dev/null | sort -u | head -5 || echo "(없음 - 영문 라벨로 폴백)"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run briefing
        env:
          KAKAO_REST_KEY:      ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_ACCESS_TOKEN:  ${{ secrets.KAKAO_ACCESS_TOKEN }}
          KRX_ID:              ${{ secrets.KRX_ID }}
          KRX_PW:              ${{ secrets.KRX_PW }}
          GMAIL_USER:          ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PW:        ${{ secrets.GMAIL_APP_PW }}
          MAIL_TO:             ${{ secrets.MAIL_TO }}
          HOLDINGS_PATH:       holdings.json
          DAILY_YEARS:         "1"
          MONTHLY_YEARS:       "5"
          PAGES_BASE_URL:      ${{ vars.PAGES_BASE_URL }}
        # 수동 실행(workflow_dispatch)일 때는 비거래일이어도 강제 실행.
        # 코드 수정 후 주말에 리포트를 다시 생성할 때 필요.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "수동 실행 → --force 적용 (비거래일에도 생성)"
            python portfolio_briefing.py --force
          else
            python portfolio_briefing.py
          fi

      - name: Prune old data (7 days retention)
        if: always()
        run: |
          # 7일 이전 data/YYYY-MM-DD/ 폴더 삭제. latest/ 는 유지.
          find data -maxdepth 1 -type d -regex 'data/[0-9]{4}-[0-9]{2}-[0-9]{2}' \
            -mtime +7 -print -exec rm -rf {} + 2>/dev/null || true
          echo "정리 후 data/ 용량:"
          du -sh data/ 2>/dev/null || true

      - name: Commit data/ folder
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ viewer.html add.html || true
          if git diff --cached --quiet; then
            echo "변경사항 없음 — 커밋 skip"
            exit 0
          fi
          git commit -m "chore: 포트폴리오 분석 데이터 $(date -u +'%Y-%m-%d %H:%M UTC')"

          # push 재시도 (다른 워크플로/Pages 배포와 충돌 시 rebase 후 재push)
          for i in 1 2 3; do
            if git push; then
              echo "✓ push 성공 (시도 $i)"
              exit 0
            fi
            echo "push 실패, rebase 후 재시도 ($i/3)"
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "✗ push 3회 재시도 모두 실패"
          exit 1

# 참고:
#  - GitHub Actions cron 은 UTC 고정. 베트남/한국은 DST 없어 오프셋 불변이라 안전.
#  - 스케줄 지연: Actions 무료 러너는 트래픽에 따라 수 분 지연될 수 있음.
#  - 비거래일은 스크립트 내부(is_kr_trading_day)에서 자동 skip.
#  - DAILY_YEARS/MONTHLY_YEARS 로 일봉/월봉 소스 기간 조절 (타임아웃 조정용).
#  - 2025-12-27부로 KRX 정보데이터시스템이 회원제로 전환되어, pykrx가
#    KRX_ID/KRX_PW 환경변수(로그인 계정)를 요구합니다. Secrets에 등록 필수.
#  - data/ 폴더는 매 실행마다 자동 커밋됩니다(상세 JSON+HTML 이력 축적).
#    커밋 충돌 방지를 위해 concurrency 로 동시 실행을 막아둠.
#  - (선택) GitHub Pages 를 켜면 카톡에 상세 리포트 링크가 붙습니다.
#    Settings→Pages 활성화 후, Actions Variables 에 PAGES_BASE_URL 등록
#    (예: https://<user>.github.io/<repo>).
