name: portfolio-briefing

on:
  schedule:
    # 베트남(ICT) 05/07/09/11/13/15/17/19시 = UTC 22/00/02/04/06/08/10/12시
    - cron: "0 0,2,4,6,8,10,12,22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 보유종목을 Secret(HOLDINGS_JSON)에서 복원. Secret이 없으면 레포의
      # holdings.json 을 사용(있을 경우). 둘 다 없으면 뒤 단계에서 에러 표시.
      - name: Restore holdings from secret
        env:
          HOLDINGS_JSON: ${{ secrets.HOLDINGS_JSON }}
        run: |
          if [ -n "$HOLDINGS_JSON" ]; then
            printf '%s' "$HOLDINGS_JSON" > holdings.json
            echo "holdings.json restored from secret ($(wc -c < holdings.json) bytes)"
          elif [ -f holdings.json ]; then
            echo "using repo holdings.json"
          else
            echo "::error::HOLDINGS_JSON secret 도 없고 holdings.json 파일도 없음"
            exit 1
          fi

      - name: Build HTML report (no send)
        env:
          HOLDINGS_PATH: holdings.json
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python portfolio_briefing.py --dry-run --force

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: briefing-html
          path: report/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: report

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Send Kakao (with Pages link)
        env:
          KAKAO_REST_KEY:      ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_ACCESS_TOKEN:  ${{ secrets.KAKAO_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          HOLDINGS_PATH:       holdings.json
          PAGES_URL:           ${{ steps.deploy.outputs.page_url }}
          EMAIL_FROM:          ${{ secrets.EMAIL_FROM }}
          EMAIL_APP_PW:        ${{ secrets.EMAIL_APP_PW }}
          EMAIL_TO:            ${{ secrets.EMAIL_TO }}
        run: python portfolio_briefing.py --force

# ===== 설정 안내 =====
# 1) 레포를 Public 으로 전환 (Settings > General > Danger Zone > Change visibility)
# 2) Settings > Pages > Source = "GitHub Actions"
# 3) 보유종목 숨기기: Settings > Secrets and variables > Actions > New secret
#    - Name : HOLDINGS_JSON
#    - Value: holdings.json 파일 내용 전체를 복사해 붙여넣기
# 4) 레포에서 holdings.json 삭제하고 .gitignore 에 추가 (커밋에 안 올라가게)
# 5) Pages 링크가 카카오에서 열리려면 카카오디벨로퍼스 [제품 링크 관리]에
#    본인 github.io 도메인(https://newsguy75.github.io) 등록 (이미 완료)
